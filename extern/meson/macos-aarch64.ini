# Cross file: build arm64 (Apple silicon) macOS artifacts, on an Apple silicon
# Mac (an Intel Mac can build them but not run them, nor their tests).
#   meson setup build/meson-macos-aarch64 --cross-file extern/meson/macos-aarch64.ini
#
# -mmacosx-version-min is the oldest macOS the build runs on: 14.4, which is what
# Qt 6.12 asks of its own. Left out, it is the version of the Mac that builds it,
# and a build made on macOS 27 would not start on any other (an Intel Mac stops at 26).
[binaries]
c = ['clang', '-arch', 'arm64', '-mmacosx-version-min=14.4']
cpp = ['clang++', '-arch', 'arm64', '-mmacosx-version-min=14.4']
objc = ['clang', '-arch', 'arm64', '-mmacosx-version-min=14.4']
objcpp = ['clang++', '-arch', 'arm64', '-mmacosx-version-min=14.4']
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-arch', 'arm64', '-mmacosx-version-min=14.4']
cpp_link_args = ['-arch', 'arm64', '-mmacosx-version-min=14.4']
objc_link_args = ['-arch', 'arm64', '-mmacosx-version-min=14.4']
objcpp_link_args = ['-arch', 'arm64', '-mmacosx-version-min=14.4']

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'darwin'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'
