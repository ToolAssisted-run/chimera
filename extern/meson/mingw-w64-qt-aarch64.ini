# Cross file for the Qt window's Windows on arm64 build (source/ui): like
# mingw-w64-aarch64.ini, but with the C++ runtime as DLLs (libc++, libunwind,
# libwinpthread-1) shared with Qt's, rather than a copy linked into each
# program - as mingw-w64-qt.ini does for x64. llvm-mingw's bin/ on PATH.
#
#   meson setup build/meson-windows-qt-arm64 --prefix "$PWD/build/qt-windows-arm64" --libdir dll \
#       --cross-file extern/meson/mingw-w64-qt-aarch64.ini -Dqt_ui=enabled
#
# with pkg-config pointed at the Windows on arm64 Qt (a second cross file setting
# [properties] pkg_config_libdir), and the Linux Qt's libexec on PATH for moc.

[binaries]
c = 'aarch64-w64-mingw32-clang'
cpp = 'aarch64-w64-mingw32-clang++'
ar = 'aarch64-w64-mingw32-ar'
strip = 'aarch64-w64-mingw32-strip'
windres = 'aarch64-w64-mingw32-windres'
pkg-config = 'pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
