# Cross file: build Windows on arm64 artifacts from a Linux host with
# llvm-mingw (clang; mingw-w64's GCC has no arm64 Windows target), whose bin/
# folder must be on PATH (tools/fetch-llvm-mingw.sh fetches the pinned release).
#   meson setup build/meson-windows-aarch64 --cross-file extern/meson/mingw-w64-aarch64.ini
# The runtime libraries (libc++, libunwind) are linked statically, as the x86-64
# build links GCC's, so the produced dlls depend only on Windows' own.

[binaries]
c = 'aarch64-w64-mingw32-clang'
cpp = 'aarch64-w64-mingw32-clang++'
ar = 'aarch64-w64-mingw32-ar'
strip = 'aarch64-w64-mingw32-strip'
windres = 'aarch64-w64-mingw32-windres'

[built-in options]
c_link_args = ['-static']
cpp_link_args = ['-static']

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
