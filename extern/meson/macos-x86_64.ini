# Cross file: build x86_64 macOS artifacts. Works on an Intel Mac and on an
# Apple silicon one, where the result runs under Rosetta 2.
#   meson setup build/meson-macos --cross-file extern/meson/macos-x86_64.ini
#
# -mmacosx-version-min is the oldest macOS the build runs on: 14.4, which is what
# Qt 6.12 asks of its own. Left out, it is the version of the Mac that builds it,
# and a build made on macOS 27 would not start on any other (an Intel Mac stops at 26).
[binaries]
c = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=14.4']
cpp = ['clang++', '-arch', 'x86_64', '-mmacosx-version-min=14.4']
objc = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=14.4']
objcpp = ['clang++', '-arch', 'x86_64', '-mmacosx-version-min=14.4']
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=14.4']
cpp_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=14.4']
objc_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=14.4']
objcpp_link_args = ['-arch', 'x86_64', '-mmacosx-version-min=14.4']

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
