# Cross file: build x86_64 macOS artifacts. Works on an Intel Mac and on an
# Apple silicon one, where the result runs under Rosetta 2.
#   meson setup build/meson-macos --cross-file extern/meson/macos-x86_64.ini
[binaries]
c = ['clang', '-arch', 'x86_64']
cpp = ['clang++', '-arch', 'x86_64']
objc = ['clang', '-arch', 'x86_64']
objcpp = ['clang++', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-arch', 'x86_64']
cpp_link_args = ['-arch', 'x86_64']
objc_link_args = ['-arch', 'x86_64']
objcpp_link_args = ['-arch', 'x86_64']

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
