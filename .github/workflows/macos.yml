name: macOS

# Chimera for macOS, on both Macs: x86-64 on an Intel runner and arm64 on an
# Apple silicon one. The engine, the window on Qt 6.12, and Chimera.app; each
# built, tested and packed on the kind of Mac it is for (docs/macos.md).
#
# The tests that need the synthetic test core use a package built on Linux: a
# package is a guest ELF and plain files, the same on every system of its CPU,
# and only miniBox's Linux guest toolchain can make one (docs/macos.md). Each
# Mac's is built on a Linux runner of its CPU.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a push supersedes an older run on the same ref, as CI's does
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  synth-core:
    # the synthetic test core and its test game, as the Linux jobs build them
    name: the synthetic test core for ${{ matrix.arch }} (built on Linux)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-26.04-arm
            # Apple silicon's pages are 16 KiB, and miniBox refuses a core
            # that exports GuestFaultHandler there (synth_wbx.c)
            synth_cflags: -DSYNTH_NO_GUEST_FAULT_HANDLER
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out miniBox
        run: git submodule update --init extern/chimera-common-minibox

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3

      - name: Build miniBox's host and guest toolchain
        # the guest compiler and its runtime object are not in the default build
        run: |
          mb=extern/chimera-common-minibox
          meson setup "$mb/build/meson-linux" "$mb"
          ninja -C "$mb/build/meson-linux" musl-gcc source/guest/emulibc.c.o

      - name: Build the package and the test game
        env:
          SYNTH_CFLAGS: ${{ matrix.synth_cflags }}
        run: ./tests/synth/build-package.sh

      - name: Keep them for the macOS job
        uses: actions/upload-artifact@v4
        with:
          name: synth-core-${{ matrix.arch }}
          path: |
            build/Cores/synth-box.chimeraCore
            tests/synth/roms/gridWalker.testrom
          if-no-files-found: error

  macos:
    name: Chimera for macOS (${{ matrix.arch }})
    needs: synth-core
    # each on its own hardware: macos-15-intel is an Intel Mac, macos-15 Apple
    # silicon (which could also run the x86-64 build, under Rosetta 2)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cpu: x64
            runner: macos-15-intel
          - arch: aarch64
            cpu: arm64
            # macOS 26: Xcode 26's actool, which compiles the app's icon, failed
            # on GitHub's macOS 15 Apple silicon image in every Xcode 26 it has
            # (its asset agent wants macOS 26's MediaToolbox), and got through
            # once with 26.0. The app still asks for macOS 14.4 and later.
            runner: macos-26
    timeout-minutes: 120
    env:
      QT_VERSION: 6.12.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        # coreutils: the tests' scripts use GNU timeout, which macOS 15 does not have;
        # nasm and pkg-config: the ffmpeg build (nasm for x264 and x265's x86-64 assembly)
        run: brew install meson ninja cmake coreutils nasm pkg-config

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-macos-aqt-3.3.0

      - name: Qt 6.12 (Qt's own download, one build for both processors)
        run: |
          if [ ! -d "$HOME/qt/$QT_VERSION/macos" ]; then
            python3 -m venv "$HOME/qt/aqt-venv"
            "$HOME/qt/aqt-venv/bin/pip" install --quiet aqtinstall==3.3.0
            "$HOME/qt/aqt-venv/bin/aqt" install-qt mac desktop "$QT_VERSION" clang_64 -m qtshadertools -O "$HOME/qt"
          fi
          # meson finds this Qt and not Homebrew's (docs/macos.md)
          mkdir -p build
          {
            echo "[binaries]"
            echo "qmake6 = '$HOME/qt/$QT_VERSION/macos/bin/qmake'"
            echo "[properties]"
            echo "pkg_config_libdir = '$HOME/qt/$QT_VERSION/macos/lib/pkgconfig'"
          } > build/qt-macos-${{ matrix.arch }}.ini

      - name: Configure
        run: |
          meson setup build/meson-macos-${{ matrix.arch }} --prefix "$PWD/build/${{ matrix.arch }}-macos" --libdir dll \
            --cross-file extern/meson/macos-${{ matrix.arch }}.ini --cross-file build/qt-macos-${{ matrix.arch }}.ini -Dqt_ui=enabled

      - name: Build
        run: meson compile -C build/meson-macos-${{ matrix.arch }}

      - name: Install
        run: meson install -C build/meson-macos-${{ matrix.arch }}

      - name: Cache the ffmpeg the build ships
        uses: actions/cache@v4
        with:
          # tools/build-ffmpeg.sh keeps what it built under a name made from its
          # CPU and its own hash
          path: build/deps/ffmpeg-macos-${{ matrix.cpu }}-*
          key: ffmpeg-macos-${{ matrix.cpu }}-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: ffmpeg
        run: tools/build-ffmpeg.sh macos build/${{ matrix.arch }}-macos/dll

      - name: The synthetic test core
        uses: actions/download-artifact@v4
        with:
          name: synth-core-${{ matrix.arch }}
          path: .

      - name: Timers as a Mac at a desk has them
        # The view models' test measures the throttles in real time, and on a
        # runner the clock throttle ran at 38 frames a second where it ran at
        # 60 at 400% speed: as if waits of 16.7 ms woke tens of ms late (macOS
        # coalesces the timers of background processes). Measured here, then
        # coalescing is turned off for the tests, and measured again.
        run: |
          cat > timers.py <<'PY'
          import time
          late = []
          for i in range(120):
              t = time.perf_counter()
              time.sleep(1 / 60)
              late.append((time.perf_counter() - t) * 1000 - 1000 / 60)
          late.sort()
          print("a 16.7 ms sleep wakes late by %.2f ms (median), %.2f (95th), %.2f (worst)" % (late[60], late[114], late[-1]))
          PY
          sysctl kern.timer.coalescing_enabled || true
          python3 timers.py
          sudo sysctl -w kern.timer.coalescing_enabled=0 || true
          python3 timers.py

      - name: Unit tests (the engine, the view models, the window)
        # without --no-rebuild: meson builds what the tests are given, the test
        # projects made from the synthetic core among it
        # one at a time: run side by side, the window tests that measure for a second
        # spent it starting up (the first frame alone took near a second)
        run: meson test -C build/meson-macos-${{ matrix.arch }} --print-errorlogs --num-processes 1

      - name: Timers as the runner had them
        # only the tests asked for them: in the same job, with coalescing still
        # off, every Xcode's actool on Apple silicon failed to compile the icon,
        # where the release's job on the same image compiled it with Xcode 26.0
        if: always()
        run: sudo sysctl -w kern.timer.coalescing_enabled=1 || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-meson-logs-${{ matrix.arch }}
          path: build/meson-macos-${{ matrix.arch }}/meson-logs/

      - name: Chimera.app
        run: |
          # the app's icon (docs/Chimera.icon, from Icon Composer) is compiled by
          # actool, which needs Xcode 26 or later: the script tries each the
          # runner has, as the runner's default is older
          tools/build-app-macos.sh --dll build/${{ matrix.arch }}-macos/dll --qt "$HOME/qt/$QT_VERSION/macos" --out build/Chimera.app
          # the light and dark icon is in the app: the script falls back to a plain
          # one when it cannot compile it, which is for a person's Mac and not for here
          test -f build/Chimera.app/Contents/Resources/Assets.car
          grep -q CFBundleIconName build/Chimera.app/Contents/Info.plist
          codesign --verify --deep --strict build/Chimera.app
          # a zip that keeps the app's links and signature, as Finder's does
          ditto -c -k --keepParent build/Chimera.app Chimera-macos-${{ matrix.cpu }}.zip

      - name: The program starts (a runner has no display, so no window is opened)
        run: |
          build/${{ matrix.arch }}-macos/dll/chimera --help > /dev/null
          build/Chimera.app/Contents/MacOS/chimera --version

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-macos-${{ matrix.cpu }}
          path: Chimera-macos-${{ matrix.cpu }}.zip
          if-no-files-found: error
