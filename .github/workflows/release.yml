name: Release

# What users download, built only from what the gates passed.
#
# Two kinds of build, deliberately:
#
# The bundle is the FRONTEND. It carries no cores: those are fifteen other
# repositories that publish themselves, and Chimera downloads them through File
# > Core Manager (docs/core-manager.md). Each core's own releases are its
# archive; the `cores` release here is the OLD one, kept because movies recorded
# before the split cite packages in it, and it no longer grows.
#
#   dev      a ROLLING prerelease, replaced on every green push to main. One
#            link that is always the newest; the assets carry the short commit
#            in their names, so a downloaded file still says what it is.
#   nightly  an IMMUTABLE dated release, once a day and only when main moved;
#            the newest is the one GitHub shows as Latest.
#            The point is not freshness (dev has that) but PERMANENCE. A movie
#            cites the build that recorded it, and someone replaying that run in
#            five years needs THAT build - not a rebuild, because a package's
#            identity is a function of its toolchain, so the same sources
#            through a later gcc are different bytes and a different hash.
#            Nightlies are therefore NEVER deleted. They are the archive.
#
# Nothing is published that did not pass CI. The release job is triggered by the
# CI workflow FINISHING SUCCESSFULLY, and builds that same commit.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  schedule:
    # 05:00 UTC, an hour after CI's own nightly, so it releases a gated commit
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated)'
        required: true
        default: dev
        type: choice
        options: [ dev, nightly ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    # A push-triggered run only publishes when CI was green. A scheduled or
    # manual run has no CI run attached and is gated by the commit's own status
    # check below.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: bundle (windows + linux)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: What is being released
        id: what
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            kind=dev
          else
            sha="${{ github.sha }}"
            kind="${{ github.event.inputs.kind || 'nightly' }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$sha" | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.what.outputs.sha }}
          # NOT recursive: the bundle carries no cores (docs/core-manager.md), so
          # what it needs checked out is what the FRONTEND is built from
          submodules: false
          fetch-depth: 0

      - name: Check out what the frontend is built from
        run: git submodule update --init --recursive extern

      - name: Has main moved since the last nightly?
        id: moved
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a nightly of an unchanged commit is a second copy of yesterday's -
          # but only a nightly that HOLDS its bundles counts: a publish that died
          # between create and upload leaves a tag at this very commit, and
          # counting it would make every later run skip the repair
          last=$(git tag -l 'nightly-*' --sort=-creatordate | head -1)
          if [ -n "$last" ] && [ "$(git rev-list -n1 "$last")" = "$(git rev-parse HEAD)" ] \
             && gh release view "$last" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^chimera-.*\.zip$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main has not moved since $last; nothing to release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Was this commit gated?
        if: github.event_name == 'schedule' && steps.moved.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the scheduled build publishes only a commit CI has passed
          conclusion=$(gh run list --workflow CI --branch main --limit 20 \
            --json headSha,conclusion --jq \
            "[.[] | select(.headSha == \"$(git rev-parse HEAD)\")] | first | .conclusion")
          if [ "$conclusion" != "success" ]; then
            echo "CI has not passed for $(git rev-parse --short HEAD) (conclusion: ${conclusion:-none})" >&2
            exit 1
          fi

      - name: Install build dependencies
        if: steps.moved.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 \
            mingw-w64 \
            libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        if: steps.moved.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build the Linux bundle
        if: steps.moved.outputs.skip != 'true'
        run: ./tools/build-bundle.sh --platform linux --out build/bundle-linux

      - name: Build the Windows bundle
        if: steps.moved.outputs.skip != 'true'
        # only the natives differ between the two: the managed assemblies are IL
        run: ./tools/build-bundle.sh --platform windows --out build/bundle-windows

      - name: Pack
        id: pack
        if: steps.moved.outputs.skip != 'true'
        run: |
          short="${{ steps.what.outputs.short }}"
          mkdir -p build/release
          ( cd build/bundle-windows && zip -qr "../release/chimera-win-x64-$short.zip" . )
          ( cd build/bundle-linux && tar czf "../release/chimera-linux-x64-$short.tar.gz" . )
          cp build/bundle-windows/LICENSES.md build/release/LICENSES.md
          cp build/bundle-windows/BUILD.txt build/release/BUILD.txt
          ls -la build/release

      - name: Release notes
        id: notes
        if: steps.moved.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${{ steps.what.outputs.short }}"
          # Everything that landed since the previous build of this kind, not
          # just the top commit (issue #76): the last nightly tag for a
          # nightly, the dev release's commit for dev. With nothing to measure
          # from (the first build, a shallow clone) the top commit alone.
          if [ "${{ steps.what.outputs.kind }}" = "dev" ]; then
            since=$(gh release view dev --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          else
            since=$(git tag -l 'nightly-*' --sort=-creatordate | head -1)
          fi
          if [ -n "$since" ] && git rev-parse -q --verify "$since^{commit}" >/dev/null 2>&1 \
             && [ "$(git rev-parse "$since^{commit}")" != "$(git rev-parse HEAD)" ]; then
            changes=$(git log --no-merges --format='- %s (`%h`)' "$since..HEAD")
          else
            changes=""
          fi
          {
            echo "Built from \`$short\` - $(git log -1 --format=%s)"
            echo
            if [ -n "$changes" ]; then
              echo "Since ${since#nightly-}:"
              echo
              echo "$changes"
              echo
            fi
            echo "| what | file |"
            echo "| --- | --- |"
            echo "| Windows x64 | \`chimera-win-x64-$short.zip\` |"
            echo "| Linux x64 | \`chimera-linux-x64-$short.tar.gz\` |"
            echo
            echo "Both carry the frontend and its natives. They carry **no cores**:"
            echo "open **File > Core Manager** and download the ones you want, from the"
            echo "projects that build them. \`BUILD.txt\` names the exact commit this"
            echo "was built from and \`LICENSES.md\` states its terms."
            echo
            echo "Each core brings its own licence with it, and some (Genesis Plus GX,"
            echo "Opera, Snes9x) forbid commercial use - which binds whatever they are"
            echo "installed into. Chimera shows a core's terms once it is installed."
            echo
            echo "Windows will warn that the executable is unsigned and from an unknown"
            echo "publisher; it is not signed, and there is no way around that warning"
            echo "short of buying a certificate."
            echo
            if [ "${{ steps.what.outputs.kind }}" = "dev" ]; then
              echo "> **Not for submissions.** A development build is replaced on every"
              echo "> change, so it may stop being downloadable - which means a movie made"
              echo "> on it can stop being replayable. Do **not** use a dev build to"
              echo "> produce a TAS for submission to toolAssisted.run; use a"
              echo "> [nightly](https://github.com/ToolAssisted-run/chimera/releases),"
              echo "> which is dated and kept forever."
              echo
            fi
          } > build/release/NOTES.md

      - name: Publish the rolling dev release
        if: steps.moved.outputs.skip != 'true' && steps.what.outputs.kind == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ONE TAG, MOVED - through the API, never `git push`. A workflow's
          # token may not create or update workflow FILES, and pushing a tag at
          # a commit whose .github/workflows differ from the default branch's
          # counts as exactly that: the first release of this pipeline died on
          # "refusing to allow a GitHub App to create or update workflow" while
          # publishing a commit main had already moved past. Deleting the
          # release with its tag and recreating it at the built commit goes
          # through the releases API, which has no such restriction, and keeps
          # the tag honest about which build the assets came from.
          #
          # Every call is retried and the release is ENSURED, not created: the
          # API answers 5xx now and then, and on 2026-09-13 a 500 on this create
          # cost the day's dev build. A create whose answer was lost may still
          # have happened, so it looks before it tries again.
          source tools/release-retry.sh
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          ensure_release dev "${{ steps.what.outputs.sha }}" \
            "Development build ${{ steps.what.outputs.short }}" build/release/NOTES.md

          # straight away, so the window in which /releases/tag/dev has nothing
          # to download is as short as an upload
          retry gh release upload dev build/release/chimera-*.zip build/release/chimera-*.tar.gz \
            build/release/LICENSES.md build/release/BUILD.txt --clobber

      - name: Publish the nightly
        if: steps.moved.outputs.skip != 'true' && steps.what.outputs.kind == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/release-retry.sh
          tag="nightly-${{ steps.what.outputs.date }}"
          # A nightly that holds its bundles is never republished; one that
          # exists EMPTY is a publish that died between create and upload, and
          # finishing it is the only way it becomes what its name says.
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^chimera-.*\.zip$'; then
            echo "$tag already exists"; exit 0
          fi
          ensure_release "$tag" "${{ steps.what.outputs.sha }}" \
            "Nightly ${{ steps.what.outputs.date }} (${{ steps.what.outputs.short }})" build/release/NOTES.md
          retry gh release upload "$tag" build/release/chimera-*.zip build/release/chimera-*.tar.gz \
            build/release/LICENSES.md build/release/BUILD.txt --clobber
