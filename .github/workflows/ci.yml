name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # daily, to catch environment drift even when nothing is committed
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref. A push to main and the nightly
# schedule are different runs of the same workflow on the same ref, so without
# the event in the key whichever starts second cancels the first. That happened
# on 2026-09-12: the nightly (cron says 04:00, GitHub actually started it at
# 08:16) cancelled a push's CI six minutes in, and because Release only follows
# a CI that CONCLUDED success, that push's Release was skipped - no failure
# anywhere, just no release for the commit. A push still supersedes an older
# push on the same ref, which is what cancel-in-progress is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  witness-level-a:
    # Level A is the fast gate: the native C reference records/verifies the
    # goldens, and the waterboxed core.wbx must reproduce them byte-for-byte
    # (including a per-frame whole-machine savestate pass). It needs only gcc,
    # python3 and meson - no display - so it runs on every push.
    # The full frontend gate (Level B) runs in parallel in witness-full below.
    name: witness level A (core equivalence, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Each CPU Chimera runs on: a package is machine code for one, so the
        # waterboxed core is built and checked on each (the arm runner is
        # Ubuntu 26.04, which ubuntu-latest is moving to, with 4 KiB pages)
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # only the waterbox host/toolchain is needed here, not the frontend's
          # native dependencies (SDL2, OpenAL, ...)
          submodules: false

      - name: No network code
        # Chimera reaches for nothing over the network (docs/core-manager.md).
        # First and here because it needs nothing built: a source that names a
        # network API fails the push in seconds.
        run: ./tools/check-no-network.sh

      - name: The cores' release notes
        # tools/release-changes.py writes the "What changed" list on every
        # core's release page (issue 357); its own check needs nothing built
        run: python3 tools/release-changes.py --self-test

      - name: Check out miniBox
        run: git submodule update --init extern/chimera-common-minibox

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3

      - name: Build miniBox (host + guest toolchain)
        run: |
          meson setup extern/chimera-common-minibox/build/meson-linux extern/chimera-common-minibox
          meson compile -C extern/chimera-common-minibox/build/meson-linux

      - name: Build the waterboxed synth core (core.wbx) and its tester
        run: sh tests/synth/package-box/build-box.sh

      - name: Witness - Level A
        run: ./tests/synth/run-witness.sh --level a

      - name: Upload witness work dir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: witness-level-a-work-${{ matrix.arch }}
          path: tests/synth/work/

  witness-full:
    # The full gate, including Level B: Chimera's window runs headless (no
    # display), loads the core.wbx package through Chimera's built-in generic
    # waterbox adapter, replays the movies, and the RAM/VRAM dumps must be
    # byte-identical to the Level A goldens - in both simple and rerecord
    # (per-frame whole-machine savestate) modes.
    #
    # This builds the entire frontend: every native dependency (SDL2, OpenAL,
    # zstd, lua, sqlite3) and the window on Qt 6.12, so it takes
    # minutes rather than seconds. It still runs per push - the level A job
    # above gives fast feedback meanwhile - and on a daily schedule, which
    # catches environment drift (toolchain/runner image changes) with no commit.
    name: witness levels A+B (frontend, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Each CPU Chimera runs on: a package is machine code for one, so the
        # waterboxed core is built and checked on each (the arm runner is
        # Ubuntu 26.04, which ubuntu-latest is moving to, with 4 KiB pages)
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # only what the frontend is built from; the cores are separate
          # repositories now and this job never opens one (see published-cores)
          submodules: false

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-${{ matrix.arch }}-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window; installs into build/dll)
        run: ./tools/ci-chimera.sh "$HOME/qt"

      - name: Build miniBox's guest toolchain and the waterboxed synth core package
        run: |
          mb=extern/chimera-common-minibox
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          sh tests/synth/package-box/build-box.sh
          ./tests/synth/build-package.sh

      - name: Cache the ffmpeg the build ships
        uses: actions/cache@v4
        with:
          # tools/build-ffmpeg.sh keeps what it built under a name made from its
          # CPU and its own hash
          path: build/deps/ffmpeg-linux-${{ matrix.arch }}-*
          key: ffmpeg-linux-${{ matrix.arch }}-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: The ffmpeg the build ships (the encode tests use it)
        run: ./tools/build-ffmpeg.sh linux build/dll

      - name: Unit tests (the engine, the view models, the window)
        run: meson test -C build/meson-linux --print-errorlogs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.arch }}
          path: build/meson-linux/meson-logs/

      - name: Witness - Levels A and B
        run: ./tests/synth/run-witness.sh

      - name: Upload witness work dir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: witness-full-work-${{ matrix.arch }}
          path: tests/synth/work/

  windows:
    # Chimera for Windows, x64 and arm64, built the way the release builds it:
    # on Linux, with mingw-w64's GCC (x64) or llvm-mingw's clang (arm64), with
    # the release's cross files (the C++ runtime as DLLs, and GCC's "posix"
    # thread model), and with the synthetic test core of the same CPU (built
    # here, natively: the arm64 build is made on an arm64 runner for that).
    # The tests are packed (tools/export-tests.py), with the compiler's
    # runtime DLLs they load, for windows-test to run on Windows.
    name: windows ${{ matrix.cpu }} (built on Linux)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            runner: ubuntu-latest
            cross: mingw-w64-qt.ini
          - cpu: arm64
            runner: ubuntu-26.04-arm
            cross: mingw-w64-qt-aarch64.ini
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out what the build needs
        run: git submodule update --init --recursive extern

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3
          if [ "${{ matrix.cpu }}" = x64 ]; then sudo apt-get install -y --no-install-recommends mingw-w64; fi

      - name: llvm-mingw (pinned, checked by its SHA256)
        if: matrix.cpu == 'arm64'
        run: tools/fetch-llvm-mingw.sh "$HOME/llvm-mingw" >> "$GITHUB_PATH"

      - name: The synthetic test core, for this CPU
        run: |
          mb=extern/chimera-common-minibox
          meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          sh tests/synth/package-box/build-box.sh
          ./tests/synth/build-package.sh

      - name: Build for Windows (${{ matrix.cpu }})
        run: |
          meson setup build/meson-windows --prefix "$PWD/build" --libdir dll --cross-file extern/meson/${{ matrix.cross }}
          meson compile -C build/meson-windows

      - name: Pack the tests
        run: |
          if [ "${{ matrix.cpu }}" = x64 ]; then
            set -- --runtime "$(ls -d /usr/lib/gcc/x86_64-w64-mingw32/*-posix | sort -V | tail -1)" --runtime /usr/x86_64-w64-mingw32/lib
          else
            set -- --runtime "$(dirname "$(dirname "$(command -v aarch64-w64-mingw32-clang)")")/aarch64-w64-mingw32/bin"
          fi
          python3 tools/export-tests.py build/meson-windows build/windows-tests "$@"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests-${{ matrix.cpu }}
          path: build/windows-tests/
          if-no-files-found: error
          retention-days: 3

  windows-test:
    # The tests of each Windows build, on a Windows machine of its CPU: what
    # Chimera's own engine and view models do on Windows, which no Linux job
    # can show (the files, the threads, the guest calls, the fault handler)
    name: windows ${{ matrix.cpu }} (tests on ${{ matrix.runner }})
    needs: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            runner: windows-2025
          - cpu: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-tests-${{ matrix.cpu }}
          path: windows-tests

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the tests
        working-directory: windows-tests
        run: python run-tests.py .

      - name: Keep the tests' output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs-${{ matrix.cpu }}
          path: windows-tests/logs/
          retention-days: 7

