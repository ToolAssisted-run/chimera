name: Publish a core package

# The publish half of every core's CI, in ONE place. A core repository's own
# workflow builds and gates its package, uploads it as an artifact, and then
# calls this - so fifteen repositories share one definition of what publishing
# means instead of fifteen copies that drift.
#
#   jobs:
#     publish:
#       needs: [ core-gate, frontend-gate ]
#       if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
#       permissions: { contents: write }
#       uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
#       with:
#         core-id: gpgx
#         artifact: gpgx-${{ github.sha }}
#         package: gpgx.chimeraCore
#
# A package is machine code for one CPU, and each is published as
# <core-id>-<version>-<arch>.chimeraCore. A core built on more than one CPU
# (its gate a matrix, one leg per CPU, each on a runner of that CPU) uploads
# one artifact per CPU, <artifact>-<arch>, and names them all:
#
#       with:
#         core-id: pcsx2
#         artifact: pcsx2-${{ github.sha }}
#         package: pcsx2.chimeraCore
#         arches: x86_64 aarch64
#
# Without `arches`, the one artifact is the x86_64 package.
#
# Only nightlies are published (user-decided, 2026-11-05): a scheduled run, or
# one started by hand, publishes an immutable `nightly-YYYY-MM-DD` when main
# moved. A push to main or a pull request publishes nothing: the job below does
# not run for them, whatever the caller's `if:` says. Nothing is published that
# the calling workflow's gates did not pass, because `needs:` is what got us
# here.

on:
  workflow_call:
    inputs:
      core-id:
        description: 'The core''s short id: the base name of the published asset (gpgx, pcsx2, eka2l1...)'
        required: true
        type: string
      artifact:
        description: 'Name of the artifact the calling workflow uploaded the package as'
        required: true
        type: string
      package:
        description: 'File name of the package inside that artifact'
        required: true
        type: string
      arches:
        description: 'The CPUs the core is built for, space-separated (x86_64, aarch64): the package for each is in artifact <artifact>-<arch>. Blank: the one artifact <artifact>, x86_64'
        required: false
        type: string
        default: ''
      chimera-repository:
        description: 'The Chimera whose tools/publish-core.sh publishes: this workflow''s own repository, for a caller of a fork'
        required: false
        type: string
        default: ToolAssisted-run/chimera
      chimera-ref:
        description: 'Its ref, as the caller''s uses: line names it'
        required: false
        type: string
        default: main

jobs:
  publish:
    name: publish (${{ inputs.core-id }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the core (for its commit, which is what the release points at)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Check out Chimera (for tools/publish-core.sh)
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.chimera-repository }}
          ref: ${{ inputs.chimera-ref }}
          path: chimera-checkout
          submodules: false

      - name: Fetch the gated package
        if: inputs.arches == ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact }}
          path: package

      - name: Fetch the gated packages, one per CPU
        # each into package/<artifact>-<arch>/
        if: inputs.arches != ''
        uses: actions/download-artifact@v5
        with:
          pattern: ${{ inputs.artifact }}-*
          path: package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the package may sit at the root of the artifact or under the path it
          # was uploaded from; find it rather than making every caller say where
          # A main that has not moved since the last nightly publishes none, and
          # a nightly a publish left half done is finished: publish-core.sh
          # decides both.
          args=()
          if [ -z '${{ inputs.arches }}' ]; then
            found=$(find package -name '${{ inputs.package }}' -print -quit)
            [ -n "$found" ] || { echo "no ${{ inputs.package }} in artifact ${{ inputs.artifact }}" >&2; find package -type f | head -20 >&2; exit 1; }
            args+=(--package "$found")
          else
            for arch in ${{ inputs.arches }}; do
              found=$(find "package/${{ inputs.artifact }}-$arch" -name '${{ inputs.package }}' -print -quit 2>/dev/null || true)
              [ -n "$found" ] || { echo "no ${{ inputs.package }} in artifact ${{ inputs.artifact }}-$arch" >&2; find package -type f | head -20 >&2; exit 1; }
              args+=(--package "$found" --arch "$arch")
            done
          fi
          ./chimera-checkout/tools/publish-core.sh \
            "${args[@]}" \
            --core-id '${{ inputs.core-id }}' \
            --sha '${{ github.sha }}'

      # Chimera reads this file instead of asking the API, which it can only do
      # 60 times an hour per address. It is written last, from the full release
      # list, so it describes what is actually there rather than what this run
      # meant to add.
      - name: Publish the version index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./chimera-checkout/tools/write-core-index.sh --repo '${{ github.repository }}'
